name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/connection-drop.test.mjs
      # Two real n8n instances on SQLite, standing in for TEST and PROD.
      - run: node scripts/e2e.mjs
